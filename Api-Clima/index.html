<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nimbus</title>
    <style>
       body{
        font-family: sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: darkturquoise;
        margin: 0;      
    } 
    .container {
    background-color: #ffffff;
    padding: 2em;
    border-radius: 10px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    text-align: center;
    width: 90%;
    max-width: 500px;
}
h1 {
    color: #333;
    margin-bottom: 1em;
}

.input-group {
    margin-bottom: 1em;
}

.input-group input {
    padding: 0.8em;
    border: 1px solid #ddd;
    border-radius: 5px;
    width: 100%;
    box-sizing: border-box;
    margin-bottom: 0.5em;
}
button {
    padding: 0.6em 1.3em;
    border: none;
    background-color: #007bff;
    color: white;
    border-radius: 5px;
    cursor: pointer;
    font-size: 1em;
}

button:hover {
    background-color: #0056b3;
}
#weather-info {
    margin-top: 1.5em;
    text-align: left;
    border-top: 1px solid #eee;
    padding-top: 1.5em;
}

#weather-info h2 {
    color: #555;
    margin: 0;
}

#weather-info p {
    margin: 0.5em 0;
    color: #666;
}

.titulo {
    color: #FFD600;
}

    </style>
</head>
<body>
   <div class="container">
    <h1 class="titulo">NIMBUS</h1>
    <h1>¿Cómo anda el clima?</h1>
   

   



   
    <div class="input-group">
        <input type="text" id="cityInput" placeholder="Nombre de la ciudad (Ej. Carepa)" />
        <input type="text" id="countryInput" placeholder="Nombre del país (Ej. CO) - Opcional" />
    </div>

    <button id="getweather">Obtener Clima</button>

    <div id="weather-info"><!-- Aquí se mostrarán los datos del clima --></div>
</div>

<script>
    const API_KEY = "7a99d4972e5b977f68a082a00c3684e3";
    const cityInput = document.getElementById("cityInput");
    const countryInput = document.getElementById("countryInput");
    const getweather = document.getElementById("getweather");
    const weatherinfoDiv = document.querySelector("#weather-info");

    getweather.addEventListener("click", () => {
        const city = cityInput.value;
        const country = countryInput.value;

        if (city.trim() === "") {
            alert("Por favor, ingresar el nombre de una ciudad");
            return;
        }

        // CORREGIDO: ahora sí usa backticks
        const API_URL = `https://api.openweathermap.org/data/2.5/weather?q=${city}${country ? "," + country : ""}&appid=${API_KEY}&units=metric&lang=es`;

        fetch(API_URL)
        .then((response) => {
            if (!response.ok) {
                throw new Error(`Error ${response.status}: Ciudad no encontrada.`);
            }
            return response.json();
        })
        .then((data) => {
            displayWeather(data);
        })
        .catch((error) => {
            weatherinfoDiv.innerHTML = `<p style="color: red;">${error.message}</p>`;
        });
    });

function displayWeather(data) {
    const cityName = data.name;
    const temp = data.main.temp;
    const description = data.weather[0].description;
    const humidity = data.main.humidity;
    const windSpeed = data.wind.speed;

    // CORREGIDO: ahora sí funciona
    weatherinfoDiv.innerHTML = `
        <h2>Clima en ${cityName}</h2>
        <p><strong>Temperatura:</strong> ${temp} °C</p>
        <p><strong>Descripción:</strong> ${description}</p>
        <p><strong>Humedad:</strong> ${humidity}%</p>
        <p><strong>Viento:</strong> ${windSpeed} m/s</p>
    `;
}
</script>
</body>
</html>
